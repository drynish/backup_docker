- id: grizzle_charge_complete_notify_michel
  alias: 'Grizzl-E: Notifier Michel — Charge terminée'
  description: Envoie une notification à Michel quand le chargement est terminé et
    qu'Isabelle est à la maison.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.grizzl_e_powermeas
    below: 1000
    for:
      minutes: 3
  conditions:
  - condition: state
    entity_id: input_boolean.presence_isabelle
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.grizzl_e_sessionenergy
    above: 0
  actions:
  - action: notify.mobile_app_michels_iphone
    data:
      title: Borne électrique
      message: >-
        Chargement terminé ! {{ states('sensor.grizzl_e_sessionenergy') }} kWh livrés en
        {% set t = states('sensor.grizzl_e_sessiontime') | int %}
        {% set h = t // 3600 %}{% set m = (t % 3600) // 60 %}{% set s = t % 60 %}
        {% if h > 0 %}{{ h }}h {% endif %}{{ m }}m {{ s }}s.
  mode: single
- id: adaptive_lighting_disable_isabelle
  alias: 'Adaptive Lighting: Désactiver quand Isabelle est présente'
  description: Désactive le tamis automatique des lumières quand Isabelle est à la
    maison
  triggers:
  - trigger: state
    entity_id: input_boolean.presence_isabelle
    to: 'on'
  conditions: []
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.adaptive_lighting_principal
  mode: single
- id: adaptive_lighting_enable_isabelle
  alias: 'Adaptive Lighting: Réactiver quand Isabelle part'
  description: Réactive le tamis automatique des lumières quand Isabelle quitte la
    maison
  triggers:
  - trigger: state
    entity_id: input_boolean.presence_isabelle
    to: 'off'
  conditions: []
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.adaptive_lighting_principal
  mode: single
- id: adaptive_lighting_reapply_cuisine
  alias: 'Adaptive Lighting: Réappliquer — Cuisine'
  description: Réapplique la luminosité circadienne quand la lumière cuisine s'allume
  triggers:
  - trigger: state
    entity_id: light.cuisine
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: switch.adaptive_lighting_principal
    state: 'on'
  - condition: state
    entity_id: input_boolean.presence_isabelle
    state: 'off'
  actions:
  - delay: 00:00:03
  - action: adaptive_lighting.set_manual_control
    data:
      lights:
      - light.cuisine
      manual_control: false
    target:
      entity_id: switch.adaptive_lighting_principal
  - action: adaptive_lighting.apply
    data:
      lights:
      - light.cuisine
      adapt_brightness: true
      adapt_color: true
      turn_on_lights: false
    target:
      entity_id: switch.adaptive_lighting_principal
  mode: restart
