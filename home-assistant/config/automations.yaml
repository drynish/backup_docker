- id: '1772155570000'
  alias: 'Cuisine/SAM: Éteindre lumières après 2h (jour ensoleillé)'
  description: Éteint les lumières cuisine et salle à manger 2h après allumage si
    la météo est ensoleillée et qu'il reste plus d'une heure avant le coucher du soleil.
    En soirée ou la nuit, les lumières restent allumées jusqu'à extinction manuelle.
  triggers:
  - trigger: state
    entity_id:
    - light.cuisine
    - light.salle_a_manger
    to: 'on'
  conditions: []
  actions:
  - delay:
      hours: 2
      minutes: 0
      seconds: 0
  - if:
    - condition: sun
      after: sunrise
      before: sunset
      before_offset: -01:00:00
    - condition: state
      entity_id: weather.maison
      state:
      - sunny
      - partlycloudy
    then:
    - action: light.turn_off
      data: {}
      target:
        entity_id:
        - light.cuisine
        - light.salle_a_manger
  mode: restart
