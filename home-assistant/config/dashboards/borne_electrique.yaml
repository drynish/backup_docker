title: Bornes électriques
views:

  # ─────────────────────────────────────────
  # Vue d'ensemble — consommation globale
  # ─────────────────────────────────────────
  - title: Vue d'ensemble
    path: overview
    icon: mdi:lightning-bolt
    cards:
      - type: glance
        title: Consommation électrique
        columns: 5
        entities:
          - entity: sensor.meter00_power
            name: Total
          - entity: sensor.consommation_chauffage
            name: Chauffage
          - entity: sensor.grizzl_e_powermeas
            name: Grizzl-E
          - entity: sensor.chargepoint_puissance
            name: ChargePoint
          - entity: sensor.consommation_sans_bornes_et_chauffage
            name: Autres

      - type: history-graph
        title: Puissance — dernières 24 h
        hours_to_show: 24
        entities:
          - entity: sensor.meter00_power
            name: Total compteur
          - entity: sensor.consommation_chauffage
            name: Chauffage
          - entity: sensor.grizzl_e_powermeas
            name: Grizzl-E
          - entity: sensor.chargepoint_puissance
            name: ChargePoint
          - entity: sensor.consommation_sans_bornes_et_chauffage
            name: Reste

  # ─────────────────────────────────────────
  # Grizzl-E
  # ─────────────────────────────────────────
  - title: Grizzl-E
    path: grizzl-e
    icon: mdi:ev-station
    cards:
      - type: glance
        title: Session en cours
        columns: 3
        entities:
          - entity: sensor.grizzl_e_powermeas
            name: Puissance
          - entity: sensor.grizzl_e_energie_session
            name: Énergie livrée
          - entity: sensor.grizzl_e_duree_session
            name: Durée

      - type: entities
        title: État de la borne
        entities:
          - entity: sensor.grizzl_e_state
            name: État
          - entity: sensor.grizzl_e_substate
            name: Sous-état
          - entity: binary_sensor.grizzl_e_sessionstarted
            name: Session active
          - entity: binary_sensor.grizzl_e_evseenabled
            name: Charge activée
          - entity: binary_sensor.grizzl_e_ocppenabled
            name: OCPP

      - type: entities
        title: Contrôles
        entities:
          - entity: switch.grizzle_charge
            name: Activer / Désactiver la charge
            icon: mdi:power-plug
          - entity: switch.grizzle_ocpp
            name: Activer / Désactiver OCPP
            icon: mdi:cloud-sync

      - type: entities
        title: Mesures & Paramètres
        entities:
          - entity: sensor.grizzl_e_voltmeas1
            name: Tension L1
          - entity: sensor.grizzl_e_voltmeas2
            name: Tension L2
          - entity: sensor.grizzl_e_voltmeas3
            name: Tension L3
          - entity: sensor.grizzl_e_curmeas1
            name: Courant L1
          - entity: sensor.grizzl_e_curmeas2
            name: Courant L2
          - entity: sensor.grizzl_e_curmeas3
            name: Courant L3
          - entity: sensor.grizzl_e_currentset
            name: Courant configuré

      - type: statistic
        entity: sensor.grizzl_e_totalenergy
        name: Énergie ce mois
        stat_type: sum
        period:
          calendar:
            period: month

      - type: history-graph
        title: Puissance — dernières 24 h
        hours_to_show: 24
        entities:
          - entity: sensor.grizzl_e_powermeas
            name: Puissance

  # ─────────────────────────────────────────
  # ChargePoint CPH25
  # ─────────────────────────────────────────
  - title: ChargePoint
    path: chargepoint
    icon: mdi:car-electric
    cards:
      - type: glance
        title: Session en cours
        columns: 3
        entities:
          - entity: sensor.cph25_power_output
            name: Puissance
          - entity: sensor.cph25_energy_output
            name: Énergie livrée
          - entity: sensor.cph25_charging_time
            name: Durée

      - type: entities
        title: État de la borne
        entities:
          - entity: sensor.cph25_charger_state
            name: État
          - entity: sensor.cph25_charging_status
            name: Statut charge
          - entity: sensor.cph25_charging_cable
            name: Câble branché
          - entity: sensor.cph25_network
            name: Réseau

      - type: entities
        title: Contrôles
        entities:
          - entity: button.cph25_start_charging
            name: Démarrer la charge
            icon: mdi:play-circle
          - entity: button.cph25_stop_charging
            name: Arrêter la charge
            icon: mdi:stop-circle
          - entity: button.cph25_restart_charger
            name: Redémarrer la borne
            icon: mdi:restart

      - type: entities
        title: Mesures & Paramètres
        entities:
          - entity: select.cph25_charging_amperage_limit
            name: Limite d'ampérage
          - entity: sensor.cph25_autonomie_ajoutee_par_heure
            name: Autonomie ajoutée/h
          - entity: sensor.cph25_autonomie_ajoutee
            name: Autonomie ajoutée
          - entity: sensor.cph25_charge_cost
            name: Coût de session
          - entity: number.cph25_led_brightness
            name: Luminosité LED

      - type: statistic
        entity: sensor.cph25_energy_output
        name: Énergie ce mois
        stat_type: sum
        period:
          calendar:
            period: month

      - type: history-graph
        title: Puissance — dernières 24 h
        hours_to_show: 24
        entities:
          - entity: sensor.cph25_power_output
            name: Puissance
