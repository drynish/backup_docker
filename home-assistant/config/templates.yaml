sensor:
  - name: "Température extérieure"
    unit_of_measurement: "°C"
    unique_id: "temperature_extérieure"
    state: >
      {{ state_attr("weather.maison", "temperature") | float(0) }}

  - name: "Température extérieure + 1 "
    unit_of_measurement: "°C"
    unique_id: "temperature_exterieure_plus_1"
    state: >
      {{ (state_attr("weather.maison", "temperature") | float(0)) + 1 }}

  - name: "Humidité extérieure"
    unit_of_measurement: "%"
    unique_id: "humidity_extérieure"
    state: >
      {{ state_attr("weather.maison", "humidity") | float(0) }}

  - name: "10 days consumption - Laveuse"
    unit_of_measurement: "kWh"
    state: >
      {{ (state_attr('sensor.sonoff_100206027c_energy', 'history') or [])| sum }}
  
  - name: "10 days consumption - Studio"
    unit_of_measurement: "kWh"
    state: >
      {{ (state_attr('sensor.sonoff_100205eba3_energy', 'history') or [])| sum }}

  - name: "Diff humidity SDB et dehors"
    unit_of_measurement: "%"
    unique_id: "diff_humidity"
    state: >
      {{ (states('sensor.detecteur_temperature_et_humidite_sdb_humidity') | float(0) - states('sensor.detecteur_temperature_et_humidite_cuisine_humidity') | float(0)) | round(2) }}

  - name: "ChargePoint Puissance"
    unique_id: "cph25_puissance_w"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    state: >
      {{ (states('sensor.cph25_power_output') | float(0) * 1000) | round(0) | int }}

  - name: "Consommation bornes"
    unique_id: "consommation_bornes"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    state: >
      {{ (states('sensor.grizzl_e_powermeas') | float(0)
          + states('sensor.cph25_power_output') | float(0) * 1000) | round(0) | int }}

  - name: "Consommation hors bornes"
    unique_id: "consommation_hors_bornes"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    state: >
      {{ [states('sensor.meter00_power') | float(0)
          - states('sensor.grizzl_e_powermeas') | float(0)
          - (states('sensor.cph25_power_output') | float(0) * 1000), 0] | max | round(0) | int }}

  - name: "Consommation sans bornes et Hilo"
    unique_id: "consommation_sans_bornes_et_hilo"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    state: >
      {{ [states('sensor.meter00_power') | float(0)
          - states('sensor.grizzl_e_powermeas') | float(0)
          - (states('sensor.cph25_power_output') | float(0) * 1000)
          - states('sensor.hilo_consommation_totale') | float(0), 0] | max | round(0) }}

  - name: "Grizzl-E Énergie session"
    unique_id: "grizzl_e_energie_session"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total
    state: >
      {{ states('sensor.grizzl_e_sessionenergy') | float(0) | round(0) | int }}

  - name: "Grizzl-E Durée session"
    unique_id: "grizzl_e_duree_session"
    state: >
      {% set t = states('sensor.grizzl_e_sessiontime') | int(0) %}
      {% set j = t // 86400 %}
      {% set h = (t % 86400) // 3600 %}
      {% set m = (t % 3600) // 60 %}
      {% set s = t % 60 %}
      {% if j > 0 %}{{ j }}j {{ h }}h {{ m }}m {{ s }}s
      {% elif h > 0 %}{{ h }}h {{ m }}m {{ s }}s
      {% elif m > 0 %}{{ m }}m {{ s }}s
      {% else %}{{ s }}s{% endif %}

  - name: "CPH25 Autonomie ajoutée"
    unique_id: "cph25_autonomie_ajoutee"
    unit_of_measurement: "km"
    device_class: distance
    state: >
      {{ (states('sensor.cph25_miles_added') | float(0) * 1.60934) | round(1) }}

  - name: "Hilo Consommation totale"
    unique_id: "hilo_consommation_totale"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    state: >
      {{ [
        states('sensor.abi_power') | float(0),
        states('sensor.chambre_des_maitres_power') | float(0),
        states('sensor.chambre_esther_power') | float(0),
        states('sensor.chambre_noel_power') | float(0),
        states('sensor.chauffe_eau_power') | float(0),
        states('sensor.chauffe_eau_bi_generation_power') | float(0),
        states('sensor.cuisine_power') | float(0),
        states('sensor.entree_power') | float(0),
        states('sensor.logan_power') | float(0),
        states('sensor.passage_noel_power') | float(0),
        states('sensor.rangement_power') | float(0),
        states('sensor.salle_commune_power') | float(0),
        states('sensor.salle_de_bain_power') | float(0),
        states('sensor.salle_de_bain_extension_power') | float(0),
        states('sensor.salle_de_bain_noel_power') | float(0),
        states('sensor.salle_de_jeu_power') | float(0),
        states('sensor.salon_arriere_power') | float(0),
        states('sensor.salon_avant_power') | float(0),
        states('sensor.salon_noel_power') | float(0)
      ] | sum | round(0) | int }}

  - name: "CPH25 Autonomie ajoutée par heure"
    unique_id: "cph25_autonomie_ajoutee_par_heure"
    unit_of_measurement: "km/h"
    state: >
      {{ (states('sensor.cph25_miles_hour_added') | float(0) * 1.60934) | round(1) }}

switch:
  - name: grizzle_charge
    state: "{{ is_state('binary_sensor.grizzl_e_evseenabled', 'off') }}"
    turn_on:
      action: rest_command.grizzle_charge_enable
    turn_off:
      action: rest_command.grizzle_charge_disable

  - name: grizzle_ocpp
    state: "{{ is_state('binary_sensor.grizzl_e_ocppenabled', 'on') }}"
    turn_on:
      action: rest_command.grizzle_ocpp_enable
    turn_off:
      action: rest_command.grizzle_ocpp_disable
