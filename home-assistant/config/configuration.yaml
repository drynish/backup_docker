counter:
default_config:

lovelace:
  dashboards:
    borne-electrique:
      mode: yaml
      title: Borne électrique
      icon: mdi:ev-station
      show_in_sidebar: true
      filename: dashboards/borne_electrique.yaml

input_button:
input_boolean:
input_datetime:
input_number:
  seuil_pluie_hier:
    name: Seuil pluie hier (mm)
    min: 0
    max: 100
    step: 1
    initial: 20
    unit_of_measurement: mm
    mode: box
  seuil_pluie_aujourd_hui:
    name: Seuil pluie aujourd'hui prévue (mm)
    min: 0
    max: 100
    step: 1
    initial: 10
    unit_of_measurement: mm
    mode: box
input_select:
input_text:
timer:
utility_meter:

group: !include groups.yaml
automation: !include automations.yaml
template: !include templates.yaml
rest: !include rest_grizzle.yaml
rest_command: !include rest_command_grizzle.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies: 
    - 127.0.0.1
    - ::1
    - 192.168.13.1
    - 172.25.0.0/16
    - 172.18.0.0/16

sensor:
  - platform: integration
    source: sensor.meter00_power
    name: Énergie compteur principal
    unique_id: energie_compteur_principal
    unit_prefix: k
    round: 2
    method: trapezoidal

  - platform: rest
    name: "Précipitations Open-Meteo"
    unique_id: precipitations_openmeteo
    resource: "https://api.open-meteo.com/v1/forecast?latitude=45.74743132532387&longitude=-73.46529360103081&daily=precipitation_sum&timezone=America%2FToronto&forecast_days=1&past_days=1"
    scan_interval: 3600
    value_template: "{{ value_json.daily.precipitation_sum[1] | float(0) }}"
    unit_of_measurement: mm
    device_class: precipitation
    json_attributes_path: "$.daily"
    json_attributes:
      - precipitation_sum
      - time

  - platform: rest
    name: "Précipitations EC L'Assomption"
    unique_id: precipitations_ec_lassomption
    resource_template: "https://api.weather.gc.ca/collections/climate-daily/items?CLIMATE_IDENTIFIER=7014160&datetime={{ (now().date() - timedelta(days=1)).isoformat() }}&f=json"
    scan_interval: 3600
    value_template: >
      {{ value_json.features[0].properties.TOTAL_PRECIPITATION | float(0)
         if value_json.features | length > 0 else 0 }}
    unit_of_measurement: mm
    device_class: precipitation

  - platform: time_date
    display_options:
    - 'time'
  - platform: waste_collection_schedule
    name: Collecte
    types:
      - Déchets
      - Recyclage
      - Composte
  - platform: statistics
    name: "Distance moyenne déchets 1h"
    unique_id: distance_moyenne_dechets_1h
    entity_id: sensor.cp28_8eb2_estimated_distance
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 50
  - platform: statistics
    name: "Distance moyenne composte 1h"
    unique_id: distance_moyenne_composte_1h
    entity_id: sensor.cp27_55dd_estimated_distance
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 50
  - platform: statistics
    name: "Distance moyenne recyclage 1h"
    unique_id: distance_moyenne_recyclage_1h
    entity_id: sensor.cp28_8e9e_estimated_distance
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 50

logger:
  default: error

sonoff:
  devices:
    100206027c:
      reporting:
        power: [30, 3600, 1]  # min seconds, max seconds, min delta value
        current: [5, 3600, 0.1]
        voltage: [60, 3600, 5]
        energy: [3600, 10]
    100205eba3:
      reporting:
        power: [30, 3600, 1]  # min seconds, max seconds, min delta value
        current: [5, 3600, 0.1]
        voltage: [60, 3600, 5]
        energy: [3600, 10]

adaptive_lighting:
  - name: "Principal"
    lights:
      - light.cuisine
      - light.salle_a_manger
      - light.lumiere_salle_de_bain
      - light.lumiere_chambre
    min_brightness: 5
    max_brightness: 70
    sleep_brightness: 5
    brightness_mode: "tanh"
    brightness_mode_time_dark: "00:45:00"
    brightness_mode_time_light: "01:30:00"
    take_over_control: true
    transition: 60

zone:
  - name: Cegep
    latitude: 46.02581787109375
    longitude: -73.43729297714367
    radius: 200
    icon: mdi:school

tuya_smart_ir_ac:
  access_id: !secret tuya_access_id
  access_secret: !secret tuya_access_secret
  country: "US"

waste_collection_schedule:
  sources:
    - name: ics
      args:
        url: https://calendar.google.com/calendar/ical/70005f62143896bd690b0de68de8614aa08f68622f42921efca82f0faad119a3%40group.calendar.google.com/private-52b90b14764a4c70c064587cf532fa56/basic.ics
      customize:
        - type: Déchets
          alias: Déchets
          icon: mdi:trash-can
        - type: Recyclage
          alias: Recyclage
          icon: mdi:recycle
        - type: Composte
          alias: Composte
          icon: mdi:leaf

