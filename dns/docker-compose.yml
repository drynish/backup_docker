version: "2"
services:
   adguardhome:
     image: adguard/adguardhome
     container_name: adguardhome
     volumes:
       - /home/drynish/docker/adguard/work:/opt/adguardhome/work
       - /home/drynish/docker/adguard/conf:/opt/adguardhome/conf
     ports:
       - "0.0.0.0:53:53/tcp"
       - "0.0.0.0:53:53/udp"
     restart: unless-stopped
     networks:
       - caddy

networks:
  caddy:
    external: true
