  version: "3.7"
  services:
    caddy:
      container_name: caddy
      image: caddy-crowdsec:latest
      ports:
        - 80:80
        - 443:443
        - 443:443/udp
      environment:
        - CADDY_INGRESS_NETWORKS=caddy
        - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
        - CROWDSEC_API_KEY=${CROWDSEC_API_KEY}
      networks:
        - caddy
      volumes:
        - /home/drynish/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
        - /var/run/docker.sock:/var/run/docker.sock
        - /home/drynish/docker/caddy/data:/data
      restart: unless-stopped
      depends_on:
        - crowdsec

    crowdsec:
      image: crowdsecurity/crowdsec:latest
      container_name: crowdsec
      environment:
        - GID=1000
        - COLLECTIONS=crowdsecurity/caddy
        - TZ=America/Montreal
      volumes:
        - /home/drynish/docker/crowdsec/config:/etc/crowdsec
        - /home/drynish/docker/crowdsec/data:/var/lib/crowdsec/data
        - /home/drynish/docker/caddy/data/logs:/var/log/caddy:ro
      networks:
        - caddy
      restart: unless-stopped

    authelia:
      image: authelia/authelia:latest
      container_name: authelia
      restart: unless-stopped
      networks:
        - caddy
      volumes:
        - /home/drynish/docker/authelia/config:/config
        - /home/drynish/docker/authelia/lib:/var/lib/authelia
      environment:
        - TZ=America/Montreal

    cloudflare-ddns:
      container_name: cloudflare-ddns
      image: favonia/cloudflare-ddns:latest
      environment:
        CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
        DOMAINS: "plex.dicroci.website,ecole.dicroci.website,wiki.dicroci.website,conservervotrepermis.ca,doc.dicroci.website,auth.dicroci.website"
        PROXIED: "is(ecole.dicroci.website) || is(wiki.dicroci.website) || is(conservervotrepermis.ca) || is(doc.dicroci.website) || is(auth.dicroci.website)"
        IP6_PROVIDER: "none"
      restart: unless-stopped

    redis:
      image: redis:alpine
      container_name: redis
      restart: unless-stopped
      networks:
        - caddy
      volumes:
        - /home/drynish/docker/redis:/data
      environment:
        - TZ=America/Montreal

  volumes:
    redis_data:

  networks:
    caddy:
      external: true
