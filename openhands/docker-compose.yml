version: "3.8"

services:
  openhands:
    image: ghcr.io/all-hands-ai/openhands:main
    container_name: openhands
    ports:
      - "3000:3000"
    environment:
      - TZ=America/Montreal
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:main-nikolaik
      - WORKSPACE_MOUNT_PATH=/home/drynish
      - LLM_MODEL=${LLM_MODEL:-ollama/qwen2.5-coder:7b}
      - LLM_BASE_URL=http://192.168.90.4:11434
      - LLM_API_KEY=ollama
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/drynish/docker/openhands/state:/.openhands-state
      - /home/drynish:/opt/workspace_base
    networks:
      - caddy
    restart: unless-stopped

networks:
  caddy:
    external: true
