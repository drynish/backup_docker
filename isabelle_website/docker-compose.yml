services:
  php-fpm:
    image: 'bitnami/php-fpm:latest'
    container_name: php-fpm
    restart: unless-stopped
    environment:
      - PHP_DISPLAY_ERRORS=0
      - PHP_FPM_PM_MAX_CHILDREN=20
      - PHP_FPM_PM_START_SERVERS=4
      - PHP_FPM_PM_MIN_SPARE_SERVERS=2
      - PHP_FPM_PM_MAX_SPARE_SERVERS=8
      - RECAPTCHA_SECRET=CHANGE_ME
      - MAILGUN_API_KEY=CHANGE_ME
      - MAILGUN_DOMAIN=conservervotrepermis.ca
    volumes:
      - /home/drynish/docker/isabelle_website/site:/var/www/html
    networks:
      - caddy

  nginx:
    image: nginx:latest
    container_name: isabelle
    restart: unless-stopped
    volumes:
      - /home/drynish/docker/isabelle_website/site:/var/www/html
      - /home/drynish/docker/isabelle_website/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - caddy
    depends_on:
      - php-fpm
      
networks:
  caddy:
    external: true
