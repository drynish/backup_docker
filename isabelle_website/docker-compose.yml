services:
  php-fpm:
    image: 'bitnami/php-fpm:latest'
    container_name: php-fpm
    restart: unless-stopped
    environment:
      - PHP_DISPLAY_ERRORS=0
      - PHP_FPM_PM_MAX_CHILDREN=20
      - PHP_FPM_PM_START_SERVERS=4
      - PHP_FPM_PM_MIN_SPARE_SERVERS=2
      - PHP_FPM_PM_MAX_SPARE_SERVERS=8
    volumes:
      - /home/drynish/git/isabelle_website:/var/www/html
      - /home/drynish/docker/isabelle_website/config.php:/var/www/config.php:ro
    networks:
      - caddy

  nginx:
    image: nginx:latest
    container_name: isabelle
    restart: unless-stopped
    volumes:
      - /home/drynish/git/isabelle_website:/var/www/html
      - /home/drynish/docker/isabelle_website/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - caddy
    depends_on:
      - php-fpm

networks:
  caddy:
    external: true
