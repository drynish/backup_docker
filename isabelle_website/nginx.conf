events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;

        root /var/www/html;
        index index.php index.html;

        include       mime.types;
        default_type  text/html;

        # Headers de sécurité
        add_header X-Content-Type-Options    "nosniff"           always;
        add_header X-Frame-Options           "SAMEORIGIN"        always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://www.google.com https://recaptcha.google.com; connect-src 'self' https://www.google.com;" always;

        # Bloquer l'accès aux fichiers sensibles
        location ~ ^/(vendor|config\.php|composer\.(json|lock)) {
            deny all;
            return 404;
        }

        # Cache des assets statiques
        location /images/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location ~* \.(css|js)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~ \.php$ {
            fastcgi_pass php-fpm:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location / {
            try_files $uri $uri/ =404;
        }

    }
}
