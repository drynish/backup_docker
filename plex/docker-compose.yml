services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    network_mode: host   # recommandé par linuxserver pour la découverte GDM/DLNA et éviter les soucis de streaming/transcodage
    environment:
      - PUID=1026
      - PGID=1026
      - TZ=America/Toronto
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}  # token frais requis à chaque (re)claim depuis https://plex.tv/claim (valide 4 min seulement)
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /home/drynish/plex:/config
      - /home/drynish/mnt/Movies:/movies
      - /home/drynish/mnt/Series:/tv
      - /home/drynish/mnt/Music:/music
    restart: unless-stopped

  scrobblex:
    image: rickgc/scrobblex:latest
    container_name: scrobblex
    restart: unless-stopped
    environment:
      - TRAKT_ID=${TRAKT_ID}
      - TRAKT_SECRET=${TRAKT_SECRET}
    volumes:
      - /home/drynish/docker/scrobblex:/app/data
    networks:
      - caddy   # réseau partagé avec Caddy, pas de port publié sur l'host

networks:
  caddy:
    external: true   # doit déjà exister — le même réseau que Caddy utilise pour proxier tes autres services
